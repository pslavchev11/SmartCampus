<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns="http://www.w3.org/1999/html"
        layout:decorate="~{layout}">
<head>
    <title th:text="#{page.clubCreate}">Club Create</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column">
<section layout:fragment="body">
    <header class="py-5 bg-light border-bottom mb-4">
        <div class="container text-center my-5">
            <h1 class="fw-bolder" th:text="${club.title}">Club Title</h1>
        </div>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-lg-8">
                <!-- Featured club card -->
                <div class="card mb-4">
                    <a href="#!">
                        <img class="card-img-top" th:src="${club.photoUrl}" alt="Club photo"/>
                    </a>
                    <div class="card-body">
                        <div class="small text-muted"
                             th:text="${#temporals.format(club.createdOn,'MMMM d, yyyy')}">
                            January 1, 2023
                        </div>
                        <h2 class="card-title" th:text="#{clubDetail.aboutHeader}">About this club</h2>
                        <p class="card-text" th:text="${club.content}">Club description…</p>
                        <div th:if="${user.id} == ${club.createdBy.id}">
                            <a class="btn btn-primary"
                               th:href="@{/clubs/{clubId}/delete(clubId=${club.id})}"
                               th:text="#{clubDetail.deleteButton}">Delete</a>
                            <a class="btn btn-primary"
                               th:href="@{/events/{clubId}/new(clubId=${club.id})}"
                               th:text="#{clubDetail.createEventButton}">Create Event</a>
                        </div>
                    </div>
                </div>

                <!-- Events laid out side-by-side -->
                <div class="row">
                    <div class="col-sm-6 col-lg-6 mb-4" th:each="event : ${club.events}">
                        <div class="card h-100">
                            <a href="#!">
                                <img class="card-img-top" th:src="${event.photoUrl}" alt="Event photo"/>
                            </a>
                            <div class="card-body d-flex flex-column">
                                <small class="text-muted"
                                       th:text="${#temporals.format(event.createdOn,'MMMM d, yyyy')}">
                                    January 1, 2023
                                </small>
                                <h5 class="card-title mt-2" th:text="${event.name}">Event Name</h5>
                                <a class="btn btn-primary mt-auto"
                                   th:href="@{/events/{id}(id=${event.id})}"
                                   th:text="#{clubEvents.moreButton}">
                                    More
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-header" th:text="#{sidebar.aboutTitle}">About Our Clubs</div>
                    <div class="card-body" th:text="#{sidebar.aboutText}">
                        Across our university we run dozens of student clubs…
                    </div>
                </div>
                <div class="card mb-4">
                    <div class="card-header" th:text="#{sidebar.goalsTitle}">Our Goals</div>
                    <div class="card-body">
                        <span th:text="#{sidebar.goal.fun}">Have Fun</span><br>
                        <span th:text="#{sidebar.goal.meet}">Meet New People</span><br>
                        <span th:text="#{sidebar.goal.learn}">Learn New Skills</span><br>
                        <span th:text="#{sidebar.goal.motivated}">Stay Focused and Motivated</span><br>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
